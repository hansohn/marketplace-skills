name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency Node — nothing to install.

      - name: Validate skills (structure + frontmatter)
        run: node scripts/validate-skills.js

      - name: Location-leak guard (pre-publish PII)
        run: node scripts/check-location-leaks.js

      - name: Routing regression tripwire
        run: node scripts/run-trigger-evals.js --min-rank1 80

      - name: Unit tests
        run: >-
          node --test
          scripts/validate-skills-test.js
          scripts/run-trigger-evals-test.js
          scripts/check-location-leaks-test.js
          scripts/price-test.js
